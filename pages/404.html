<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Page Not Found — AcademyKit School Sportswear"/>
  <title>404 — Page Not Found | AcademyKit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/pages.css"/>
  <style>
    body { overflow: hidden; }
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      animation: float 6s ease-in-out infinite;
    }
    .search-404 {
      max-width: 440px;
      margin: 0 auto 36px;
      display: flex;
      gap: 10px;
    }
    .search-404 input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-full);
      padding: 12px 20px;
      font-size: .95rem;
      color: var(--text-primary);
    }
  </style>
</head>
<body>

<!-- Particle background -->
<div class="particles" aria-hidden="true">
  <div class="particle" style="width:100px;height:100px;background:var(--royal-violet);top:10%;left:5%;animation-delay:0s;animation-duration:8s"></div>
  <div class="particle" style="width:60px;height:60px;background:var(--electric-coral);top:20%;right:10%;animation-delay:1s;animation-duration:6s"></div>
  <div class="particle" style="width:80px;height:80px;background:var(--champagne);bottom:15%;left:20%;animation-delay:2s;animation-duration:7s"></div>
  <div class="particle" style="width:40px;height:40px;background:var(--royal-violet);bottom:30%;right:15%;animation-delay:0.5s;animation-duration:5s"></div>
  <div class="particle" style="width:120px;height:120px;background:var(--electric-coral);top:50%;left:80%;animation-delay:1.5s;animation-duration:9s;opacity:.08"></div>
</div>

<!-- Minimal brand header: logo + tagline, theme + RTL toggles only (no navbar/footer) -->
<header class="navbar scrolled" style="background:rgba(16,26,51,.6);backdrop-filter:blur(20px)">
  <div class="navbar-inner">
    <a href="../index.html" class="navbar-logo">
      <div class="logo-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.7V17c0 .6-.5 1-1 1.2C7.9 18.8 7 20.2 7 22"/><path d="M14 14.7V17c0 .6-.5 1-1 1.2 1.1.6 2 2 2 3.8"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg></div>
      <div class="logo-text"><span class="logo-name">AcademyKit</span><span class="logo-tagline">Elite Sportswear</span></div>
    </a>
    <div style="flex:1"></div>
    <div class="nav-controls">
      <button class="nav-control-btn" data-theme-toggle title="Toggle dark/light mode" aria-label="Toggle theme"><span data-theme-icon><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button>
      <button class="nav-control-btn" data-rtl-toggle title="Toggle RTL/LTR" aria-label="Toggle text direction"><span data-dir-icon>RTL</span></button>
    </div>
  </div>
</header>

<!-- 404 Content -->
<div class="error-page" style="position:relative;z-index:1">
  <div class="error-bg-text" aria-hidden="true">404</div>

  <div data-reveal="scale">
    <div class="error-number">404</div>
    <h1 class="error-title">Oops! Page Not Found</h1>
    <p class="error-desc">
      The page you're looking for has been substituted off the field. It may have moved, been removed, or never existed in the first place.
    </p>

    <!-- Search bar -->
    <div class="search-404">
      <input type="text" placeholder="Search for kits, sports or pages..." aria-label="Search"/>
      <button class="btn btn-primary" onclick="Toast.show({type:'info',title:'Searching...',message:'Search functionality coming soon.'})"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></button>
    </div>

    <!-- Quick links -->
    <div style="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:48px">
      <a href="../index.html" class="btn btn-primary btn-lg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Go Home</a>
      <a href="services.html" class="btn btn-secondary btn-lg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3 3.5 6 5.5 10l2-1V21h9V9l2 1 2-4L15 3a3 3 0 0 1-6 0z"/></svg> Explore Kits</a>
      <a href="contact.html" class="btn btn-outline btn-lg"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/></svg> Contact Us</a>
    </div>

    <!-- Suggested pages -->
    <div style="background:var(--bg-card);border:1px solid var(--border-color);border-radius:var(--radius-xl);padding:32px 40px;max-width:640px;margin:0 auto">
      <h3 style="font-family:var(--font-heading);font-weight:700;margin-bottom:20px;font-size:1rem"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg> Popular Pages</h3>
      <div class="rgrid" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left">
        <a href="services.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.5l3.2 2.3-1.2 3.7H10L8.8 9.8z"/><path d="M12 2.5V5M4.9 5.9l1.8 1.5M2.5 12H5M4.9 18.1l1.8-1.5M12 21.5V19M19.1 18.1l-1.8-1.5M21.5 12H19M19.1 5.9l-1.8 1.5"/></svg></span> Football Kits
        </a>
        <a href="services.html#cricket" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 3.5c3.5 3 3.5 14 0 17"/><path d="M14.5 3.5c-3.5 3-3.5 14 0 17"/></svg></span> Cricket Kits
        </a>
        <a href="pricing.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg></span> Pricing
        </a>
        <a href="about.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5h.01"/></svg></span> About Us
        </a>
        <a href="blog.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l4 4L8 20l-5 1 1-5z"/><path d="M14 6l4 4"/></svg></span> Blog
        </a>
        <a href="contact.html" style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg-surface);border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;transition:all .2s;color:var(--text-secondary)">
          <span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7A2 2 0 0 1 22 16.9z"/></svg></span> Contact
        </a>
      </div>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
</body>
</html>
